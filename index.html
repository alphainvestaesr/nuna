<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NuNa &middot; Acesso</title>
<meta name="description" content="Acesso privado ao NuNa - Financial Clarity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000}
  *{box-sizing:border-box}
  a{color:#C9A227;text-decoration:none}
  a:hover{color:#E3C158}
  input{font-family:inherit}
  input::placeholder{color:#6E7F9C}
  @keyframes nunaFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes nunaBrasao{from{opacity:0;transform:scale(.965)}to{opacity:1;transform:none}}
  .palco{position:relative;min-height:100vh;display:flex;align-items:stretch;overflow:hidden;
    background:#000;font-family:Jost,Helvetica,Arial,sans-serif;color:#EDE4CE}
  .cam{position:absolute;inset:0}
  .brasao{position:absolute;inset:0;background-image:url('assets/brasao.png');background-repeat:no-repeat;
    background-position:78% 46%;background-size:auto 108%;animation:nunaBrasao 1.1s ease-out both}
  .conteudo{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:clamp(8px,2vh,36px);
    width:100%;max-width:1320px;margin:0 auto;padding:clamp(12px,2.2vh,40px) clamp(24px,5vw,72px) clamp(10px,1.8vh,32px)}
  header{display:flex;align-items:center;justify-content:space-between;gap:24px;animation:nunaFade .7s ease-out both}
  .selo{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(201,162,39,.55);
    border-radius:50%;font-family:Cinzel,Georgia,serif;font-size:15px;color:#C9A227}
  .marca{font-family:Cinzel,Georgia,serif;font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:#EDE4CE}
  .tag{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:#93A4C0}
  .meio{display:grid;grid-template-columns:minmax(0,46%);gap:56px;align-items:center;min-height:0}
  .bloco{max-width:460px;min-height:0;animation:nunaFade .9s ease-out .1s both}
  .kicker{display:inline-block;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:#C9A227;margin-bottom:clamp(6px,1.2vh,20px)}
  h1{font-family:Cinzel,Georgia,serif;font-weight:500;font-size:clamp(26px,3.1vw,50px);line-height:1.06;
    letter-spacing:-.01em;margin:0 0 clamp(7px,1.2vh,18px);color:#F6EFDD;text-wrap:pretty}
  .lede{font-size:clamp(13.5px,1.05vw,16px);line-height:1.5;color:#C3CFE2;margin:0 0 clamp(11px,1.8vh,28px);max-width:40ch;text-wrap:pretty}
  form{display:flex;flex-direction:column;gap:clamp(7px,1.2vh,14px);max-width:392px;padding:clamp(13px,2vh,26px);
    border:1px solid rgba(201,162,39,.28);border-radius:4px;background:rgba(0,0,0,.66);backdrop-filter:blur(6px)}
  label{display:flex;flex-direction:column;gap:7px;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:#93A4C0}
  input[type=email],input[type=password]{background:rgba(255,255,255,.04);border:1px solid rgba(201,162,39,.3);
    border-radius:3px;padding:13px 14px;font-size:15px;letter-spacing:0;text-transform:none;color:#F6EFDD;outline:none}
  input:focus{border-color:#C9A227;background:rgba(255,255,255,.07)}
  button[type=submit]{margin-top:6px;border:none;border-radius:3px;background:#C9A227;color:#07182F;
    font-family:Cinzel,Georgia,serif;font-size:14px;letter-spacing:.16em;text-transform:uppercase;padding:15px 18px;cursor:pointer}
  button[type=submit]:hover{background:#E3C158}
  button[type=submit]:disabled{opacity:.6;cursor:default}
  .erro{margin:0;font-size:13px;line-height:1.5;color:#E8878A}
  .ok{margin:0;font-size:13px;line-height:1.5;color:#9FD3A8}
  .rodape-form{display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.2}
  .rodape-form span{font-size:12px;color:#7F91AD}
  .rodape-form a{font-size:12px}
  footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
    font-size:11.5px;color:#6E7F9C;animation:nunaFade 1s ease-out .2s both}
  @media(max-width:760px){ .meio{grid-template-columns:minmax(0,1fr)} .brasao{opacity:.35;background-position:70% 40%} }
</style>
</head>
<body>
<div class="palco">
  <div class="cam" style="background:radial-gradient(44% 48% at 74% 44%, rgba(201,162,39,.16) 0%, rgba(201,162,39,0) 70%)"></div>
  <div class="cam" style="background:linear-gradient(100deg,#000 0%,rgba(0,0,0,.93) 26%,rgba(0,0,0,.5) 44%,rgba(0,0,0,.1) 58%,rgba(0,0,0,0) 100%)"></div>
  <div class="cam" style="background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 34%)"></div>
  <canvas id="moedas" class="cam" aria-hidden="true" style="width:100%;height:100%;pointer-events:none;
    mask-image:linear-gradient(90deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.62) 34%,rgba(0,0,0,1) 58%,rgba(0,0,0,1) 100%);
    -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.62) 34%,rgba(0,0,0,1) 58%,rgba(0,0,0,1) 100%)"></canvas>
  <div class="brasao"></div>

  <div class="conteudo">
    <header>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="selo">N</span>
        <span class="marca">NuNa</span>
      </div>
      <span class="tag">Financial Clarity</span>
    </header>

    <div class="meio">
      <div class="bloco">
        <span class="kicker">Acesso privado</span>
        <h1>O dinheiro da<br>nossa casa,<br>sob um s&oacute; bras&atilde;o.</h1>
        <p class="lede">Ana, Manuela e o que &eacute; das duas. Entre com seu e-mail e senha e tenha clareza.</p>

        <form id="form-login" autocomplete="on">
          <label>E-mail
            <input type="email" id="email" name="email" autocomplete="username" placeholder="voce@exemplo.com" required>
          </label>
          <label>Senha
            <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
          </label>
          <p class="erro" id="erro" hidden></p>
          <p class="ok" id="ok" hidden></p>
          <button type="submit" id="entrar">Entrar</button>
          <div class="rodape-form">
            <span>A sess&atilde;o continua ativa neste aparelho</span>
            <a href="#" id="esqueci">Esqueci a senha</a>
          </div>
        </form>
      </div>
    </div>

    <footer>
      <span>NuNa &middot; acesso por e-mail e senha</span>
      <span>Dados no Supabase, protegidos por RLS</span>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
/* --- login --- */
(function () {
  var f = document.getElementById('form-login');
  var bt = document.getElementById('entrar');
  var erro = document.getElementById('erro');
  var ok = document.getElementById('ok');
  var DESTINO = 'app.html';

  function aviso(el2, txt) {
    erro.hidden = true; ok.hidden = true;
    if (!txt) return;
    el2.textContent = txt; el2.hidden = false;
  }
  function humano(e) {
    var m = String(e && e.message || e);
    if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha nao conferem.';
    if (/Email not confirmed/i.test(m)) return 'Esta conta ainda nao foi confirmada.';
    if (/household/i.test(m)) return m;
    if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexao com o banco. Tente de novo.';
    return m;
  }

  /* ja logada? vai direto para o dashboard */
  Auth.iniciar().then(function (s) { if (s) location.replace(DESTINO); })
    .catch(function (e) { aviso(erro, humano(e)); });

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value;
    var senha = document.getElementById('senha').value;
    if (!email || !senha) { aviso(erro, 'Preencha e-mail e senha.'); return; }
    bt.disabled = true; aviso(null, '');
    bt.textContent = 'Entrando...';
    Auth.entrar(email, senha)
      .then(function () { location.href = DESTINO; })
      .catch(function (err) {
        console.error(err);
        aviso(erro, humano(err));
        bt.disabled = false; bt.textContent = 'Entrar';
      });
  });

  document.getElementById('esqueci').addEventListener('click', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value;
    if (!email) { aviso(erro, 'Escreva seu e-mail no campo acima e clique de novo.'); return; }
    Auth.recuperarSenha(email)
      .then(function () { aviso(ok, 'Se este e-mail tiver conta, o link de redefinicao chega em instantes.'); })
      .catch(function (err) { aviso(erro, humano(err)); });
  });
})();

/* --- chuva de moedas no fundo (mesma animacao da versao aprovada) --- */
(function () {
  var cv = document.getElementById('moedas');
  var ctx = cv.getContext('2d');
  var w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.max(1, Math.round(w * dpr));
    cv.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  var FOCO = 340, Z_LONGE = 1150, Z_PERTO = 150, DENS = 40, ORIGEM_X = 0.7;
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function nova(inicial) {
    var ang = rnd(0, Math.PI * 2), spd = rnd(10, 46);
    return {
      x3: rnd(-26, 26), y3: rnd(-18, 18),
      z: inicial ? rnd(Z_PERTO + 60, Z_LONGE) : rnd(Z_LONGE * 0.86, Z_LONGE),
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd * 0.55 - rnd(6, 22), vz: -rnd(90, 210),
      base: rnd(4.2, 9), fase: rnd(0, Math.PI * 2), giro: rnd(0.9, 2.4),
      cifrao: Math.random() < 0.28, tom: Math.random() < 0.4 ? '#E7CE7C' : '#C9A227', alpha: rnd(0.5, 0.95)
    };
  }
  var pecas = []; for (var i = 0; i < DENS; i++) pecas.push(nova(true));
  var prev = performance.now();
  function quadro(t) {
    var dt = Math.min((t - prev) / 1000, 0.05); prev = t;
    if (cv.clientWidth !== w || cv.clientHeight !== h) resize();
    ctx.clearRect(0, 0, w, h);
    var cx = w * ORIGEM_X, cy = h * 0.5;
    pecas.sort(function (a, b) { return b.z - a.z; });
    for (var k = 0; k < pecas.length; k++) {
      var p = pecas[k];
      p.z += p.vz * dt; p.vy += 26 * dt; p.x3 += p.vx * dt; p.y3 += p.vy * dt; p.fase += p.giro * dt;
      var f = FOCO / p.z, px = cx + p.x3 * f * 6, py = cy + p.y3 * f * 6;
      if (p.z < Z_PERTO || px < -140 || px > w + 140 || py < -140 || py > h + 140) { pecas[k] = nova(false); continue; }
      var r = p.base * f * 1.9;
      var entra = Math.min(1, (Z_LONGE - p.z) / 190), sai = Math.min(1, (p.z - Z_PERTO) / 160);
      var achat = Math.abs(Math.cos(p.fase));
      ctx.save(); ctx.translate(px, py);
      ctx.globalAlpha = p.alpha * entra * sai * (p.cifrao ? 0.85 : 0.6 + 0.4 * achat);
      ctx.fillStyle = p.tom;
      if (p.cifrao) {
        ctx.rotate(Math.sin(p.fase * 0.5) * 0.25);
        ctx.font = '600 ' + (r * 2.6).toFixed(1) + 'px Cinzel, Georgia, serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('$', 0, 0);
      } else {
        ctx.beginPath();
        ctx.ellipse(0, 0, Math.max(0.5, r * achat), r, Math.sin(p.fase * 0.3) * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
})();
</script>
</body>
</html>
